<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mpc_rotation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(180deg, #0a1628 0%, #1a2d50 30%, #2a4a7f 60%, #1a2d50 100%);
            min-height: 100vh; padding: 20px; color: #e8dcc8; position: relative; overflow-x: hidden;
        }
        
        .bg-img-3 {
            position: fixed;
            right: -5%;
            top: -5%;
            width: 50%;
            height: 110%;
            object-fit: cover;
            opacity: 0.04;
            z-index: 0;
            pointer-events: none;
            border-radius: 20px;
        }

        .bubbles-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .bubble {
            position: absolute; bottom: -80px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), rgba(100,180,255,0.05));
            border: 1px solid rgba(255,255,255,0.08); animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            10% { opacity: 0.6; }
            50% { transform: translateY(-50vh) translateX(30px) scale(1.1); }
            90% { opacity: 0.3; }
            100% { transform: translateY(-110vh) translateX(-20px) scale(0.8); opacity: 0; }
        }
        
        .container { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }
        
        .header { text-align: center; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .header-img { width: 100px; height: 70px; border-radius: 8px; object-fit: cover; border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .header-text h1 { font-size: 2.2em; font-weight: 400; letter-spacing: 2px; color: #f0e6d3; text-transform: lowercase; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .header-text .subtitle { font-size: 0.85em; color: #8ab4d6; margin-top: 4px; font-style: italic; }
        
        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(255, 255, 255, 0.08); border-radius: 8px; margin-bottom: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(100,180,255,0.15); flex-wrap: wrap; gap: 10px; }
        .sync-status { display: flex; align-items: center; gap: 8px; font-size: 0.85em; color: #8ab4d6; }
        .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #6B8E23; animation: pulse 2s infinite; }
        .sync-dot.offline { background: #CD5C5C; animation: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .shift-info { font-size: 0.85em; color: #8ab4d6; }
        .shift-info strong { color: #f0e6d3; }
        
        .rotation-scheme { text-align: center; margin-bottom: 20px; padding: 15px; background: rgba(255, 255, 255, 0.06); border-radius: 8px; border: 1px solid rgba(100,180,255,0.1); }
        .rotation-scheme .label { font-size: 0.7em; text-transform: uppercase; letter-spacing: 2px; color: #6a8fb5; margin-bottom: 10px; }
        .rotation-chain { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 6px; }
        .chain-number { width: 32px; height: 32px; line-height: 32px; border-radius: 50%; background: rgba(100,180,255,0.2); color: #c8ddf0; font-size: 0.85em; font-weight: bold; transition: all 0.3s; border: 1px solid rgba(100,180,255,0.2); }
        .chain-number.active { background: #4a90d9; color: #fff; transform: scale(1.15); box-shadow: 0 2px 12px rgba(74,144,217,0.5); border-color: #4a90d9; }
        .chain-arrow { color: #6a8fb5; font-size: 0.8em; }
        
        .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px; padding: 15px; background: rgba(255, 255, 255, 0.06); border-radius: 8px; border: 1px solid rgba(100,180,255,0.1); }
        .controls input[type="text"], .controls input[type="date"] { padding: 8px 12px; border: 1px solid rgba(100,180,255,0.3); border-radius: 6px; background: rgba(255, 255, 255, 0.08); font-family: inherit; font-size: 0.9em; color: #e8dcc8; outline: none; transition: border-color 0.3s; flex: 1; min-width: 150px; }
        .controls input[type="text"]:focus, .controls input[type="date"]:focus { border-color: #4a90d9; }
        .controls input[type="text"]::placeholder { color: #6a8fb5; }
        .controls input[type="date"] { color: #c8ddf0; }
        .controls input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
        .date-inputs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex: 1; }
        .date-inputs span { color: #6a8fb5; font-size: 0.85em; }
        .btn { padding: 8px 14px; border: none; border-radius: 6px; font-family: inherit; font-size: 0.85em; cursor: pointer; transition: all 0.3s; letter-spacing: 0.5px; white-space: nowrap; }
        .btn-primary { background: #4a90d9; color: #fff; }
        .btn-primary:hover { background: #3a7bc8; }
        .btn-secondary { background: rgba(100,180,255,0.15); color: #c8ddf0; border: 1px solid rgba(100,180,255,0.25); }
        .btn-secondary:hover { background: rgba(100,180,255,0.25); }
        .btn-danger { background: rgba(205, 92, 92, 0.2); color: #e8a0a0; border: 1px solid rgba(205, 92, 92, 0.3); }
        .btn-danger:hover { background: rgba(205, 92, 92, 0.35); }
        
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card-box { background: rgba(255, 255, 255, 0.01); border-radius: 8px; padding: 20px; border: 1px solid rgba(100,180,255,0.03); backdrop-filter: blur(2px); }
        .card-box h2 { font-size: 1.05em; font-weight: 400; color: #f0e6d3; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(100,180,255,0.15); letter-spacing: 1px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; font-size: 0.88em; border-bottom: 1px solid rgba(100,180,255,0.08); }
        th { font-weight: 600; color: #6a8fb5; font-size: 0.75em; text-transform: uppercase; letter-spacing: 1px; }
        .squad-num { display: inline-block; width: 28px; height: 28px; line-height: 28px; text-align: center; border-radius: 50%; background: rgba(100,180,255,0.25); color: #c8ddf0; font-size: 0.82em; font-weight: bold; border: 1px solid rgba(100,180,255,0.2); }
        .squad-num.next { background: rgba(74,144,217,0.4); border-color: #4a90d9; }
        .remove-btn { background: none; border: none; cursor: pointer; font-size: 1.2em; opacity: 0.5; transition: opacity 0.3s, transform 0.2s; padding: 2px 4px; }
        .remove-btn:hover { opacity: 1; transform: scale(1.2); }
        
        /* 🌳 РАЗВЕТВЛЕНИЕ - ИСПРАВЛЕННАЯ ВЕРСИЯ */
        .squads-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .squad-row {
            display: flex;
            align-items: flex-start;
        }

        .squad-badge {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(100, 180, 255, 0.25);
            color: #c8ddf0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
            border: 1px solid rgba(100, 180, 255, 0.3);
            margin-top: 10px;
        }

        .squad-members {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-left: 24px;
        }

        /* Вертикальная линия ствола */
        .squad-members::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 14px;
            bottom: 14px;
            width: 2px;
            background: rgba(100, 180, 255, 0.3);
        }

        .member-item {
            position: relative;
            padding: 6px 0;
            color: #c8ddf0;
            font-size: 0.95em;
            line-height: 1.5;
        }

        /* Горизонтальная ветка к имени */
        .member-item::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 50%;
            width: 14px;
            height: 2px;
            background: rgba(100, 180, 255, 0.3);
        }

        /* Закругление верхнего угла у первого элемента */
        .member-item:first-child::after {
            content: '';
            position: absolute;
            left: -14px;
            top: 0;
            width: 14px;
            height: 14px;
            border-top: 2px solid rgba(100, 180, 255, 0.3);
            border-left: 2px solid rgba(100, 180, 255, 0.3);
            border-top-left-radius: 8px;
            background: transparent;
            pointer-events: none;
        }

        /* Закругление нижнего угла у последнего элемента */
        .member-item:last-child::after {
            content: '';
            position: absolute;
            left: -14px;
            bottom: 0;
            width: 14px;
            height: 14px;
            border-bottom: 2px solid rgba(100, 180, 255, 0.3);
            border-left: 2px solid rgba(100, 180, 255, 0.3);
            border-bottom-left-radius: 8px;
            background: transparent;
            pointer-events: none;
        }

        /* Единственный сотрудник — прямая линия без изгибов */
        .member-item.is-single::before {
            display: none;
        }
        .member-item.is-single::after {
            display: none;
        }
        .squad-members.is-single::before {
            display: none;
        }

        /* Пустой отряд */
        .squad-members.is-empty::before {
            display: none;
        }
        .squad-empty {
            padding: 6px 0;
            color: #6a8fb5;
            font-style: italic;
            font-size: 0.9em;
            position: relative;
        }
        .squad-empty::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 50%;
            width: 14px;
            height: 2px;
            background: rgba(100, 180, 255, 0.2);
        }

        .history-card { background: rgba(255, 255, 255, 0.01); border-radius: 8px; padding: 20px; border: 1px solid rgba(100,180,255,0.03); backdrop-filter: blur(2px); max-height: 400px; overflow-y: auto; }
        .history-card h2 { font-size: 1.05em; font-weight: 400; color: #f0e6d3; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(100,180,255,0.15); letter-spacing: 1px; }
        .history-item { padding: 12px 0; border-bottom: 1px solid rgba(100,180,255,0.08); }
        .history-item:last-child { border-bottom: none; }
        .history-shift { font-size: 0.85em; color: #4a90d9; margin-bottom: 4px; font-weight: 600; }
        .history-date { font-size: 0.75em; color: #6a8fb5; margin-bottom: 6px; }
        .history-assignments { font-size: 0.8em; color: #c8ddf0; line-height: 1.6; }
        
        .loading { text-align: center; padding: 30px; color: #6a8fb5; font-style: italic; }
        .spinner { border: 3px solid rgba(100,180,255,0.15); border-top: 3px solid #4a90d9; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 20px; color: #6a8fb5; font-style: italic; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(100,180,255,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(100,180,255,0.3); border-radius: 3px; }

        @media (max-width: 768px) {
            body { padding: 15px 10px; }
            .header { flex-direction: row; gap: 8px; }
            .header-img { width: 60px; height: 42px; }
            .header-text h1 { font-size: 1.4em; letter-spacing: 1px; }
            .header-text .subtitle { font-size: 0.75em; }
            .status-bar { flex-direction: column; align-items: flex-start; gap: 8px; }
            .main-grid { grid-template-columns: 1fr; }
            .controls { flex-direction: column; align-items: stretch; }
            .date-inputs { flex-direction: column; align-items: stretch; }
            .date-inputs span { text-align: center; }
            .btn { width: 100%; text-align: center; padding: 10px; }
            th, td { padding: 6px 4px; font-size: 0.8em; }
            .squad-num { width: 24px; height: 24px; line-height: 24px; font-size: 0.8em; }
            .bg-img-3 { width: 100%; height: 100%; left: 0; right: 0; top: 0; opacity: 0.08; }
            .squad-badge { width: 32px; height: 32px; font-size: 0.85em; }
            .member-item { font-size: 0.9em; }
        }
    </style>
</head>
<body>
    <img class="bg-img-3" src="img3.png" alt="background" onerror="this.style.display='none'">
    
    <div class="bubbles-container" id="bubblesContainer"></div>
    <div class="container">
        <div class="header">
            <img class="header-img" src="img1.png" alt="img1" onerror="this.style.display='none'">
            <div class="header-text">
                <h1>mpc_rotation</h1>
                <div class="subtitle">ротация отрядов по сменам</div>
            </div>
            <img class="header-img" src="img2.png" alt="img2" onerror="this.style.display='none'">
        </div>

        <div class="status-bar">
            <div class="sync-status">
                <div class="sync-dot offline" id="syncDot"></div>
                <span id="syncText">подключение...</span>
            </div>
            <div class="shift-info">
                смена: <strong id="currentShiftDisplay">10.10.2026 — 24.10.2026</strong>
            </div>
        </div>

        <div class="rotation-scheme">
            <div class="label">порядок ротации</div>
            <div class="rotation-chain" id="rotationDiagram"></div>
        </div>

        <div class="controls">
            <div id="publicMsg" style="width: 100%; text-align: center; color: #6a8fb5; font-style: italic; padding: 10px 0;">
                режим просмотра (для изменений войдите как админ)
            </div>

            <div id="adminControls" class="admin-only" style="display: none; width: 100%; flex-direction: column; gap: 10px;">
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <input type="text" id="personName" placeholder="имя сотрудника">
                    <button class="btn btn-primary" onclick="window.addPersonGlobal()">добавить</button>
                </div>
                <div class="date-inputs">
                    <span>следующая смена:</span>
                    <input type="date" id="nextShiftStart">
                    <span>—</span>
                    <input type="date" id="nextShiftEnd">
                    <button class="btn btn-secondary" onclick="window.nextShiftGlobal()">начать смену</button>
                </div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 5px;">
                    <button class="btn btn-secondary" onclick="window.previousRotationGlobal()">назад</button>
                    <button class="btn btn-secondary" onclick="window.resetRotationGlobal()">сброс</button>
                    <button class="btn btn-danger" onclick="window.clearHistoryGlobal()">очистить историю</button>
                </div>
            </div>

            <button id="authBtn" class="btn btn-danger" onclick="window.toggleAuth()" style="margin-left: auto; margin-top: 5px;">🔒 вход для админа</button>
        </div>

        <div class="main-grid">
            <div class="card-box">
                <h2>распределение</h2>
                <div id="currentTableLoading" class="loading"><div class="spinner"></div>загрузка...</div>
                <table id="currentTable" style="display: none;">
                    <thead><tr><th>сотрудник</th><th>отряд</th><th>след.</th><th></th></tr></thead>
                    <tbody id="currentTableBody"></tbody>
                </table>
            </div>

            <div class="card-box">
                <h2>состав отрядов</h2>
                <div id="squadListLoading" class="loading"><div class="spinner"></div>загрузка...</div>
                <div id="squadsList" class="squads-list" style="display: none;"></div>
            </div>
        </div>

        <div class="history-card">
            <h2>история смен</h2>
            <div id="historyList"><div class="loading"><div class="spinner"></div>загрузка...</div></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdJQ5Q14uc0nZlIbXRCxbLHb0t7toDmJk",
            authDomain: "patriotic-center-tablet.firebaseapp.com",
            databaseURL: "https://patriotic-center-tablet-default-rtdb.firebaseio.com",
            projectId: "patriotic-center-tablet",
            storageBucket: "patriotic-center-tablet.firebasestorage.app",
            messagingSenderId: "785036138962",
            appId: "1:785036138962:web:69f2af44ea65e87a4e500b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        const TOTAL_SQUADS = 8;
        const ROTATION_ORDER = [1, 5, 2, 6, 3, 7, 4, 8];

        const INITIAL_PEOPLE = [
            { name: "Радковец Анна", initialSquad: 1 }, { name: "Крупская Лия", initialSquad: 1 }, { name: "Куприянчик Илья", initialSquad: 1 },
            { name: "Дронов Матвей", initialSquad: 2 }, { name: "Сирисько Анастасия", initialSquad: 2 }, { name: "Левчук Анастасия", initialSquad: 2 },
            { name: "Полховская Екатерина", initialSquad: 3 }, { name: "Панков Илья", initialSquad: 3 }, { name: "Сохоневич Юлия", initialSquad: 3 },
            { name: "Хоружая Екатерина", initialSquad: 4 }, { name: "Бегеза Екатерина", initialSquad: 4 }, { name: "Давидович Дмитрий", initialSquad: 4 },
            { name: "Богуш Анастасия", initialSquad: 5 }, { name: "Косцов Никита", initialSquad: 5 }, { name: "Рудько Виктор", initialSquad: 5 },
            { name: "Дубина Мария", initialSquad: 6 }, { name: "Каминский Глеб", initialSquad: 6 },
            { name: "Стеценко Елизавета", initialSquad: 7 }, { name: "Мазурук Владислава", initialSquad: 7 }, { name: "Кухарчик Иветта", initialSquad: 7 },
            { name: "Ничик Анна", initialSquad: 8 }, { name: "Тарасевич Екатерина", initialSquad: 8 }, { name: "Цикоридзе Анастасия", initialSquad: 8 }
        ];

        let people = [];
        let currentRotation = 0;
        let currentShift = { startDate: "2026-10-10", endDate: "2026-10-24" };
        let shifts = [];
        let isAdmin = false;

        function getCurrentSquad(person) {
            const initialIndex = ROTATION_ORDER.indexOf(person.initialSquad);
            const currentIndex = (initialIndex + currentRotation) % ROTATION_ORDER.length;
            return ROTATION_ORDER[currentIndex];
        }

        function getNextSquad(squad) {
            const index = ROTATION_ORDER.indexOf(squad);
            return ROTATION_ORDER[(index + 1) % ROTATION_ORDER.length];
        }

        function formatDate(dateStr) {
            if (!dateStr) return "—";
            const parts = dateStr.split("-");
            if (parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
            return dateStr;
        }

        function createBubbles() {
            const container = document.getElementById('bubblesContainer');
            for (let i = 0; i < 15; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const size = Math.random() * 60 + 20;
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = Math.random() * 100 + '%';
                bubble.style.animationDuration = (Math.random() * 15 + 10) + 's';
                bubble.style.animationDelay = (Math.random() * 10) + 's';
                container.appendChild(bubble);
            }
        }

        function updateAdminUI() {
            const publicMsg = document.getElementById('publicMsg');
            const adminControls = document.getElementById('adminControls');
            const authBtn = document.getElementById('authBtn');
            if (isAdmin) {
                publicMsg.style.display = 'none';
                adminControls.style.display = 'flex';
                authBtn.textContent = ' выход';
            } else {
                publicMsg.style.display = 'block';
                adminControls.style.display = 'none';
                authBtn.textContent = ' вход для админа';
            }
        }

        window.toggleAuth = function() {
            if (isAdmin) {
                signOut(auth).then(() => alert("вы вышли из режима админа"));
            } else {
                const email = prompt("введите email администратора:");
                if (!email) return;
                const password = prompt("введите пароль:");
                if (!password) return;
                signInWithEmailAndPassword(auth, email, password)
                    .then(() => alert("успешный вход! теперь вы можете управлять сменами."))
                    .catch((error) => alert("ошибка входа: проверьте email и пароль"));
            }
        };

        function renderRotationDiagram() {
            const container = document.getElementById('rotationDiagram');
            container.innerHTML = '';
            ROTATION_ORDER.forEach((squad, index) => {
                const num = document.createElement('div');
                num.className = 'chain-number' + (index === currentRotation % ROTATION_ORDER.length ? ' active' : '');
                num.textContent = squad;
                container.appendChild(num);
                if (index < ROTATION_ORDER.length - 1) {
                    const arrow = document.createElement('span');
                    arrow.className = 'chain-arrow';
                    arrow.textContent = '→';
                    container.appendChild(arrow);
                }
            });
        }

        function renderCurrentTable() {
            const tbody = document.getElementById('currentTableBody');
            tbody.innerHTML = '';
            if (people.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-state">нет сотрудников</td></tr>';
                return;
            }
            people.forEach((person) => {
                const currentSquad = getCurrentSquad(person);
                const nextSquad = getNextSquad(currentSquad);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${person.name}</td>
                    <td><span class="squad-num">${currentSquad}</span></td>
                    <td><span class="squad-num next">${nextSquad}</span></td>
                    <td><button class="remove-btn" data-id="${person.id}" title="удалить">😱</button></td>
                `;
                tbody.appendChild(tr);
            });
            tbody.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', () => removePerson(btn.getAttribute('data-id')));
            });
        }

        function renderSquadsList() {
            const list = document.getElementById('squadsList');
            list.innerHTML = '';

            for (let i = 1; i <= TOTAL_SQUADS; i++) {
                const peopleInSquad = people.filter(p => getCurrentSquad(p) === i);

                const row = document.createElement('div');
                row.className = 'squad-row';

                let membersContainerClass = 'squad-members';
                let membersHtml = '';

                if (peopleInSquad.length === 0) {
                    membersContainerClass += ' is-empty';
                    membersHtml = '<div class="squad-empty">пусто</div>';
                } else if (peopleInSquad.length === 1) {
                    membersContainerClass += ' is-single';
                    membersHtml = `<div class="member-item is-single">${peopleInSquad[0].name}</div>`;
                } else {
                    membersHtml = peopleInSquad.map(p => `<div class="member-item">${p.name}</div>`).join('');
                }

                row.innerHTML = `
                    <div class="squad-badge">${i}</div>
                    <div class="${membersContainerClass}">
                        ${membersHtml}
                    </div>
                `;

                list.appendChild(row);
            }
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            container.innerHTML = '';
            if (shifts.length === 0) {
                container.innerHTML = '<div class="empty-state">история пуста</div>';
                return;
            }
            shifts.slice().reverse().forEach((entry, idx) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="history-shift">смена ${shifts.length - idx}: ${formatDate(entry.startDate)} — ${formatDate(entry.endDate)}</div>
                    <div class="history-date">ротация #${entry.rotation + 1}</div>
                    <div class="history-assignments">${entry.assignments.map(a => `${a.name} → отряд ${a.squad}`).join('<br>')}</div>
                `;
                container.appendChild(div);
            });
        }

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('syncDot');
            const text = document.getElementById('syncText');
            if (connected) {
                dot.classList.remove('offline');
                text.textContent = 'синхронизировано';
            } else {
                dot.classList.add('offline');
                text.textContent = 'нет подключения';
            }
        }

        function updateShiftDisplay() {
            const display = document.getElementById('currentShiftDisplay');
            if (currentShift.startDate && currentShift.endDate) {
                display.textContent = `${formatDate(currentShift.startDate)} — ${formatDate(currentShift.endDate)}`;
            } else {
                display.textContent = '10.10.2026 — 24.10.2026';
            }
        }

        function loadData() {
            onValue(ref(db, 'rotation'), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    people = data.people || [];
                    currentRotation = data.currentRotation || 0;
                    currentShift = data.currentShift || { startDate: "2026-10-10", endDate: "2026-10-24" };
                    shifts = data.shifts || [];
                } else {
                    people = INITIAL_PEOPLE.map((p, i) => ({ ...p, id: 'initial_' + i }));
                    currentRotation = 0;
                    currentShift = { startDate: "2026-10-10", endDate: "2026-10-24" };
                    shifts = [];
                    saveData();
                }
                updateConnectionStatus(true);
                renderAll();
            }, (error) => {
                console.error('ошибка:', error);
                updateConnectionStatus(false);
            });
        }

        function saveData() {
            if (!isAdmin) {
                alert("для изменений необходимо войти в режим админа");
                return;
            }
            set(ref(db, 'rotation'), {
                people, currentRotation, currentShift, shifts,
                lastUpdated: serverTimestamp()
            }).then(() => updateConnectionStatus(true))
              .catch((error) => {
                  console.error('ошибка сохранения:', error);
                  alert("ошибка сохранения: проверьте подключение или права доступа");
                  updateConnectionStatus(false);
              });
        }

        function renderAll() {
            document.getElementById('currentTableLoading').style.display = 'none';
            document.getElementById('squadListLoading').style.display = 'none';
            document.getElementById('currentTable').style.display = 'table';
            document.getElementById('squadsList').style.display = 'flex';
            renderRotationDiagram();
            renderCurrentTable();
            renderSquadsList();
            renderHistory();
            updateShiftDisplay();
        }

        window.addPersonGlobal = function() {
            const nameInput = document.getElementById('personName');
            const name = nameInput.value.trim();
            if (name) {
                people.push({ name, initialSquad: 1, id: 'person_' + Date.now() });
                nameInput.value = '';
                saveData();
            }
        };

        window.removePerson = function(id) {
            if (confirm('удалить сотрудника?')) {
                people = people.filter(p => p.id !== id);
                saveData();
            }
        };

        window.nextShiftGlobal = function() {
            const startDate = document.getElementById('nextShiftStart').value;
            const endDate = document.getElementById('nextShiftEnd').value;
            if (!startDate || !endDate) { alert('укажи даты следующей смены'); return; }
            if (new Date(endDate) <= new Date(startDate)) { alert('дата конца должна быть позже даты начала'); return; }

            const assignments = people.map(person => ({ name: person.name, squad: getCurrentSquad(person) }));
            shifts.push({ startDate: currentShift.startDate, endDate: currentShift.endDate, rotation: currentRotation, assignments });
            
            currentRotation++;
            currentShift = { startDate, endDate };
            
            document.getElementById('nextShiftStart').value = '';
            document.getElementById('nextShiftEnd').value = '';
            saveData();
        };

        window.previousRotationGlobal = function() {
            if (currentRotation > 0 && shifts.length > 0) {
                const lastShift = shifts.pop();
                currentRotation = lastShift.rotation;
                currentShift = { startDate: lastShift.startDate, endDate: lastShift.endDate };
                saveData();
            }
        };

        window.resetRotationGlobal = function() {
            if (confirm('сбросить всё к начальному состоянию?')) {
                currentRotation = 0;
                currentShift = { startDate: "2026-10-10", endDate: "2026-10-24" };
                shifts = [];
                saveData();
            }
        };

        window.clearHistoryGlobal = function() {
            if (confirm('очистить историю смен?')) {
                shifts = [];
                saveData();
            }
        };

        onAuthStateChanged(auth, (user) => {
            isAdmin = !!user;
            updateAdminUI();
        });

        onValue(ref(db, '.info/connected'), (snapshot) => {
            updateConnectionStatus(snapshot.val() === true);
        });

        createBubbles();
        loadData();
    </script>
</body>
</html>
