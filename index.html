<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ротация отрядов</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; color: white; margin-bottom: 30px; font-size: 2.5em; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .status-bar {
            background: white; border-radius: 15px; padding: 15px 20px; margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .sync-status { display: flex; align-items: center; gap: 10px; }
        .sync-dot { width: 12px; height: 12px; border-radius: 50%; background: #27ae60; animation: pulse 2s infinite; }
        .sync-dot.offline { background: #e74c3c; animation: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .info-panel { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .info-panel h2 { color: #667eea; margin-bottom: 15px; }
        .rotation-diagram { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; }
        .rotation-step { text-align: center; padding: 15px 20px; background: #f0f0f0; border-radius: 10px; min-width: 80px; transition: all 0.3s; }
        .rotation-step.active { background: #667eea; color: white; transform: scale(1.15); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .rotation-step .number { font-size: 1.8em; font-weight: bold; }
        .rotation-step .label { font-size: 0.85em; opacity: 0.7; }
        .arrow { font-size: 1.5em; color: #667eea; }
        .controls { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 20px; }
        .controls h2 { color: #667eea; margin-bottom: 15px; }
        .button-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 12px 24px; border: none; border-radius: 8px; background: #667eea; color: white; font-size: 1em; cursor: pointer; transition: all 0.3s; font-weight: 600; }
        button:hover { background: #764ba2; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        button.danger { background: #e74c3c; }
        button.danger:hover { background: #c0392b; }
        button.success { background: #27ae60; }
        button.success:hover { background: #219a52; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .table-container { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .table-container h2 { color: #667eea; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #ddd; font-size: 0.95em; }
        th { background: #667eea; color: white; font-weight: 600; }
        tr:hover { background: #f5f5f5; }
        .squad-badge { display: inline-block; width: 35px; height: 35px; line-height: 35px; border-radius: 50%; background: #667eea; color: white; font-weight: bold; }
        .squad-badge.next { background: #764ba2; }
        .person-name { font-weight: 500; }
        .remove-btn { background: #e74c3c; color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; font-size: 0.8em; margin-left: 5px; }
        .history-container { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-height: 500px; overflow-y: auto; }
        .history-container h2 { color: #667eea; margin-bottom: 15px; }
        .history-entry { padding: 12px; margin-bottom: 10px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid #667eea; }
        .history-entry .date { font-weight: bold; color: #667eea; font-size: 0.9em; }
        .history-entry .assignments { margin-top: 8px; font-size: 0.9em; line-height: 1.6; }
        .add-form { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input[type="text"] { flex: 1; min-width: 200px; padding: 10px 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; }
        input[type="text"]:focus { outline: none; border-color: #667eea; }
        .loading { text-align: center; padding: 40px; color: #667eea; font-size: 1.2em; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } h1 { font-size: 1.8em; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Система ротации отрядов</h1>

        <div class="status-bar">
            <div class="sync-status">
                <div class="sync-dot offline" id="syncDot"></div>
                <span id="syncText">Подключение...</span>
            </div>
            <div><strong>Текущая ротация:</strong> <span id="rotationNumber">1</span></div>
        </div>

        <div class="info-panel">
            <h2>📍 Схема ротации (зигзаг)</h2>
            <div class="rotation-diagram" id="rotationDiagram"></div>
        </div>

        <div class="controls">
            <h2>⚙️ Управление</h2>
            <div class="add-form">
                <input type="text" id="personName" placeholder="Имя сотрудника">
                <button onclick="window.addPersonGlobal()">➕ Добавить</button>
            </div>
            <div class="button-group">
                <button class="success" onclick="window.nextRotationGlobal()">➡️ Следующая ротация</button>
                <button onclick="window.previousRotationGlobal()">⬅️ Назад</button>
                <button onclick="window.resetRotationGlobal()">🔄 Сброс</button>
                <button class="danger" onclick="window.clearHistoryGlobal()">🗑️ Очистить историю</button>
            </div>
        </div>

        <div class="main-grid">
            <div class="table-container">
                <h2>👥 Текущее распределение</h2>
                <div id="currentTableLoading" class="loading"><div class="spinner"></div>Загрузка данных...</div>
                <table id="currentTable" style="display: none;">
                    <thead><tr><th>Сотрудник</th><th>Отряд</th><th>Следующий</th><th></th></tr></thead>
                    <tbody id="currentTableBody"></tbody>
                </table>
            </div>

            <div class="table-container">
                <h2>📊 Состав отрядов</h2>
                <div id="squadTableLoading" class="loading"><div class="spinner"></div>Загрузка данных...</div>
                <table id="squadTable" style="display: none;">
                    <thead><tr><th>Отряд</th><th>Сотрудники</th></tr></thead>
                    <tbody id="squadTableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="history-container">
            <h2>📜 История ротаций</h2>
            <div id="historyList"><div class="loading"><div class="spinner"></div>Загрузка истории...</div></div>
        </div>
    </div>

    <!-- Подключаем Firebase как модули -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // ТВОИ ДАННЫЕ ИЗ FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDdJQ5Q14uc0nZlIbXRCxbLHb0t7toDmJk",
            authDomain: "patriotic-center-tablet.firebaseapp.com",
            databaseURL: "https://patriotic-center-tablet-default-rtdb.firebaseio.com",
            projectId: "patriotic-center-tablet",
            storageBucket: "patriotic-center-tablet.firebasestorage.app",
            messagingSenderId: "785036138962",
            appId: "1:785036138962:web:69f2af44ea65e87a4e500b"
        };

        // Инициализация
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const TOTAL_SQUADS = 8;
        const ROTATION_ORDER = [1, 5, 2, 6, 3, 7, 4, 8];

        const INITIAL_PEOPLE = [
            { name: "Радковец Анна", initialSquad: 1 }, { name: "Крупская Лия", initialSquad: 1 }, { name: "Куприянчик Илья", initialSquad: 1 },
            { name: "Дронов Матвей", initialSquad: 2 }, { name: "Сирисько Анастасия", initialSquad: 2 }, { name: "Левчук Анастасия", initialSquad: 2 },
            { name: "Полховская Екатерина", initialSquad: 3 }, { name: "Панков Илья", initialSquad: 3 }, { name: "Сохоневич Юлия", initialSquad: 3 },
            { name: "Хоружая Екатерина", initialSquad: 4 }, { name: "Бегеза Екатерина", initialSquad: 4 }, { name: "Давидович Дмитрий", initialSquad: 4 },
            { name: "Богуш Анастасия", initialSquad: 5 }, { name: "Косцов Никита", initialSquad: 5 }, { name: "Рудько Виктор", initialSquad: 5 },
            { name: "Дубина Мария", initialSquad: 6 }, { name: "Каминский Глеб", initialSquad: 6 },
            { name: "Стеценко Елизавета", initialSquad: 7 }, { name: "Мазурук Владислава", initialSquad: 7 }, { name: "Кухарчик Иветта", initialSquad: 7 },
            { name: "Ничик Анна", initialSquad: 8 }, { name: "Тарасевич Екатерина", initialSquad: 8 }, { name: "Цикоридзе Анастасия", initialSquad: 8 }
        ];

        let people = [];
        let currentRotation = 0;
        let history = [];
        let isConnected = false;

        function getCurrentSquad(person) {
            const initialIndex = ROTATION_ORDER.indexOf(person.initialSquad);
            const currentIndex = (initialIndex + currentRotation) % ROTATION_ORDER.length;
            return ROTATION_ORDER[currentIndex];
        }

        function getNextSquad(squad) {
            const index = ROTATION_ORDER.indexOf(squad);
            return ROTATION_ORDER[(index + 1) % ROTATION_ORDER.length];
        }

        function renderRotationDiagram() {
            const container = document.getElementById('rotationDiagram');
            container.innerHTML = '';
            ROTATION_ORDER.forEach((squad, index) => {
                const step = document.createElement('div');
                step.className = 'rotation-step' + (index === currentRotation % ROTATION_ORDER.length ? ' active' : '');
                step.innerHTML = `<div class="number">${squad}</div><div class="label">Позиция ${index + 1}</div>`;
                container.appendChild(step);
                if (index < ROTATION_ORDER.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.textContent = '→';
                    container.appendChild(arrow);
                }
            });
        }

        function renderCurrentTable() {
            const tbody = document.getElementById('currentTableBody');
            tbody.innerHTML = '';
            if (people.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #999;">Нет сотрудников</td></tr>';
                return;
            }
            people.forEach((person) => {
                const currentSquad = getCurrentSquad(person);
                const nextSquad = getNextSquad(currentSquad);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="person-name">${person.name}</td>
                    <td><span class="squad-badge">${currentSquad}</span></td>
                    <td><span class="squad-badge next">${nextSquad}</span></td>
                    <td><button class="remove-btn" data-id="${person.id}">✕</button></td>
                `;
                tbody.appendChild(tr);
            });
            // Навешиваем обработчики на кнопки удаления
            tbody.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', () => removePerson(btn.getAttribute('data-id')));
            });
        }

        function renderSquadTable() {
            const tbody = document.getElementById('squadTableBody');
            tbody.innerHTML = '';
            for (let i = 1; i <= TOTAL_SQUADS; i++) {
                const peopleInSquad = people.filter(p => getCurrentSquad(p) === i);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="squad-badge">${i}</span></td>
                    <td style="text-align: left; padding-left: 15px;">
                        ${peopleInSquad.length > 0 ? peopleInSquad.map(p => p.name).join('<br>') : '<span style="color: #999;">Пусто</span>'}
                    </td>
                `;
                tbody.appendChild(tr);
            }
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            container.innerHTML = '';
            if (history.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">История пуста</p>';
                return;
            }
            history.slice().reverse().forEach(entry => {
                const div = document.createElement('div');
                div.className = 'history-entry';
                div.innerHTML = `
                    <div class="date">📅 ${entry.date} — Ротация #${entry.rotation}</div>
                    <div class="assignments">${entry.assignments.map(a => `<strong>${a.name}</strong> → Отряд ${a.squad}`).join('<br>')}</div>
                `;
                container.appendChild(div);
            });
        }

        function updateConnectionStatus(connected) {
            isConnected = connected;
            const dot = document.getElementById('syncDot');
            const text = document.getElementById('syncText');
            if (connected) {
                dot.classList.remove('offline');
                text.textContent = 'Синхронизировано';
            } else {
                dot.classList.add('offline');
                text.textContent = 'Нет подключения';
            }
        }

        function loadData() {
            onValue(ref(db, 'rotation'), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    people = data.people || [];
                    currentRotation = data.currentRotation || 0;
                    history = data.history || [];
                } else {
                    people = INITIAL_PEOPLE.map((p, i) => ({ ...p, id: 'initial_' + i }));
                    currentRotation = 0;
                    history = [];
                    saveData();
                }
                updateConnectionStatus(true);
                renderAll();
            }, (error) => {
                console.error('Ошибка загрузки:', error);
                updateConnectionStatus(false);
            });
        }

        function saveData() {
            set(ref(db, 'rotation'), {
                people,
                currentRotation,
                history,
                lastUpdated: serverTimestamp()
            }).then(() => {
                updateConnectionStatus(true);
            }).catch((error) => {
                console.error('Ошибка сохранения:', error);
                updateConnectionStatus(false);
            });
        }

        function renderAll() {
            document.getElementById('currentTableLoading').style.display = 'none';
            document.getElementById('squadTableLoading').style.display = 'none';
            document.getElementById('currentTable').style.display = 'table';
            document.getElementById('squadTable').style.display = 'table';
            document.getElementById('rotationNumber').textContent = currentRotation + 1;
            renderRotationDiagram();
            renderCurrentTable();
            renderSquadTable();
            renderHistory();
        }

        // Функции, привязанные к window, чтобы работали из HTML onclick
        window.addPersonGlobal = function() {
            const nameInput = document.getElementById('personName');
            const name = nameInput.value.trim();
            if (name) {
                people.push({ name, initialSquad: 1, id: 'person_' + Date.now() });
                nameInput.value = '';
                saveData();
            }
        };

        window.removePerson = function(id) {
            if (confirm('Удалить этого сотрудника?')) {
                people = people.filter(p => p.id !== id);
                saveData();
            }
        };

        window.nextRotationGlobal = function() {
            const assignments = people.map(person => ({ name: person.name, squad: getCurrentSquad(person) }));
            history.push({ date: new Date().toLocaleString('ru-RU'), rotation: currentRotation + 1, assignments });
            currentRotation++;
            saveData();
        };

        window.previousRotationGlobal = function() {
            if (currentRotation > 0) {
                currentRotation--;
                if (history.length > 0) history.pop();
                saveData();
            }
        };

        window.resetRotationGlobal = function() {
            if (confirm('Сбросить ротацию к начальному состоянию?')) {
                currentRotation = 0;
                history = [];
                saveData();
            }
        };

        window.clearHistoryGlobal = function() {
            if (confirm('Очистить всю историю ротаций?')) {
                history = [];
                saveData();
            }
        };

        // Отслеживание подключения
        onValue(ref(db, '.info/connected'), (snapshot) => {
            updateConnectionStatus(snapshot.val() === true);
        });

        // Запуск
        loadData();
    </script>
</body>
</html>
