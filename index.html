<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mpc_rotation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #F5E6D3 0%, #E8D5B7 30%, #D4A574 70%, #C17F59 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #3D2B1F;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Заголовок */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.8em;
            font-weight: 400;
            letter-spacing: 3px;
            color: #5C3D2E;
            text-transform: lowercase;
        }

        .header .subtitle {
            font-size: 0.95em;
            color: #8B6F47;
            margin-top: 8px;
            font-style: italic;
        }

        /* Статус-бар */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(193, 127, 89, 0.2);
        }

        .sync-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            color: #8B6F47;
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6B8E23;
            animation: pulse 2s infinite;
        }

        .sync-dot.offline {
            background: #CD5C5C;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .rotation-info {
            font-size: 0.9em;
            color: #8B6F47;
        }

        .rotation-info strong {
            color: #5C3D2E;
        }

        /* Мини-схема ротации */
        .rotation-scheme {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(193, 127, 89, 0.15);
        }

        .rotation-scheme .label {
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #A08060;
            margin-bottom: 12px;
        }

        .rotation-chain {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chain-number {
            width: 36px;
            height: 36px;
            line-height: 36px;
            border-radius: 50%;
            background: #D4A574;
            color: #fff;
            font-size: 0.95em;
            font-weight: bold;
            transition: all 0.3s;
        }

        .chain-number.active {
            background: #A0522D;
            transform: scale(1.2);
            box-shadow: 0 2px 8px rgba(160, 82, 45, 0.4);
        }

        .chain-arrow {
            color: #C17F59;
            font-size: 0.9em;
        }

        /* Панель управления (компактная) */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(193, 127, 89, 0.15);
        }

        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 14px;
            border: 1px solid #D4A574;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
            font-size: 0.9em;
            color: #3D2B1F;
            outline: none;
            transition: border-color 0.3s;
        }

        .controls input[type="text"]:focus {
            border-color: #A0522D;
        }

        .controls input[type="text"]::placeholder {
            color: #B8956A;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: #A0522D;
            color: #fff;
        }

        .btn-primary:hover {
            background: #8B4513;
        }

        .btn-secondary {
            background: rgba(193, 127, 89, 0.3);
            color: #5C3D2E;
            border: 1px solid #D4A574;
        }

        .btn-secondary:hover {
            background: rgba(193, 127, 89, 0.5);
        }

        .btn-danger {
            background: rgba(205, 92, 92, 0.2);
            color: #8B3A3A;
            border: 1px solid rgba(205, 92, 92, 0.3);
        }

        .btn-danger:hover {
            background: rgba(205, 92, 92, 0.4);
        }

        /* Таблицы */
        .tables-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .table-card {
            background: rgba(255, 255, 255, 0.75);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid rgba(193, 127, 89, 0.15);
            backdrop-filter: blur(10px);
        }

        .table-card h2 {
            font-size: 1.1em;
            font-weight: 400;
            color: #5C3D2E;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(193, 127, 89, 0.2);
            letter-spacing: 1px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px 8px;
            text-align: left;
            font-size: 0.9em;
            border-bottom: 1px solid rgba(193, 127, 89, 0.1);
        }

        th {
            font-weight: 600;
            color: #8B6F47;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .squad-num {
            display: inline-block;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 50%;
            background: #D4A574;
            color: #fff;
            font-size: 0.85em;
            font-weight: bold;
        }

        .squad-num.next {
            background: #A0522D;
        }

        .remove-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            opacity: 0.4;
            transition: opacity 0.3s;
            padding: 2px 6px;
        }

        .remove-btn:hover {
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #B8956A;
            font-style: italic;
        }

        /* История */
        .history-card {
            background: rgba(255, 255, 255, 0.75);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid rgba(193, 127, 89, 0.15);
            backdrop-filter: blur(10px);
            max-height: 400px;
            overflow-y: auto;
        }

        .history-card h2 {
            font-size: 1.1em;
            font-weight: 400;
            color: #5C3D2E;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(193, 127, 89, 0.2);
            letter-spacing: 1px;
        }

        .history-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(193, 127, 89, 0.1);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-date {
            font-size: 0.8em;
            color: #A08060;
            margin-bottom: 6px;
        }

        .history-assignments {
            font-size: 0.85em;
            color: #5C3D2E;
            line-height: 1.8;
        }

        /* Загрузка */
        .loading {
            text-align: center;
            padding: 40px;
            color: #B8956A;
            font-style: italic;
        }

        .spinner {
            border: 3px solid rgba(193, 127, 89, 0.2);
            border-top: 3px solid #A0522D;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Скроллбар */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(193, 127, 89, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: #D4A574;
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            .tables-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2em;
            }
            .controls {
                flex-direction: column;
            }
            .controls input[type="text"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>mpc_rotation</h1>
            <div class="subtitle">осенняя ротация отрядов</div>
        </div>

        <div class="status-bar">
            <div class="sync-status">
                <div class="sync-dot offline" id="syncDot"></div>
                <span id="syncText">подключение...</span>
            </div>
            <div class="rotation-info">
                ротация <strong id="rotationNumber">1</strong>
            </div>
        </div>

        <div class="rotation-scheme">
            <div class="label">порядок ротации</div>
            <div class="rotation-chain" id="rotationDiagram"></div>
        </div>

        <div class="controls">
            <input type="text" id="personName" placeholder="имя сотрудника">
            <button class="btn btn-primary" onclick="window.addPersonGlobal()">добавить</button>
            <button class="btn btn-secondary" onclick="window.nextRotationGlobal()">следующая</button>
            <button class="btn btn-secondary" onclick="window.previousRotationGlobal()">назад</button>
            <button class="btn btn-secondary" onclick="window.resetRotationGlobal()">сброс</button>
            <button class="btn btn-danger" onclick="window.clearHistoryGlobal()">очистить историю</button>
        </div>

        <div class="tables-grid">
            <div class="table-card">
                <h2>распределение</h2>
                <div id="currentTableLoading" class="loading">
                    <div class="spinner"></div>
                    загрузка...
                </div>
                <table id="currentTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>сотрудник</th>
                            <th>отряд</th>
                            <th>след.</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="currentTableBody"></tbody>
                </table>
            </div>

            <div class="table-card">
                <h2>состав отрядов</h2>
                <div id="squadTableLoading" class="loading">
                    <div class="spinner"></div>
                    загрузка...
                </div>
                <table id="squadTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>отряд</th>
                            <th>сотрудники</th>
                        </tr>
                    </thead>
                    <tbody id="squadTableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="history-card">
            <h2>история</h2>
            <div id="historyList">
                <div class="loading">
                    <div class="spinner"></div>
                    загрузка...
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdJQ5Q14uc0nZlIbXRCxbLHb0t7toDmJk",
            authDomain: "patriotic-center-tablet.firebaseapp.com",
            databaseURL: "https://patriotic-center-tablet-default-rtdb.firebaseio.com",
            projectId: "patriotic-center-tablet",
            storageBucket: "patriotic-center-tablet.firebasestorage.app",
            messagingSenderId: "785036138962",
            appId: "1:785036138962:web:69f2af44ea65e87a4e500b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const TOTAL_SQUADS = 8;
        const ROTATION_ORDER = [1, 5, 2, 6, 3, 7, 4, 8];

        const INITIAL_PEOPLE = [
            { name: "Радковец Анна", initialSquad: 1 },
            { name: "Крупская Лия", initialSquad: 1 },
            { name: "Куприянчик Илья", initialSquad: 1 },
            { name: "Дронов Матвей", initialSquad: 2 },
            { name: "Сирисько Анастасия", initialSquad: 2 },
            { name: "Левчук Анастасия", initialSquad: 2 },
            { name: "Полховская Екатерина", initialSquad: 3 },
            { name: "Панков Илья", initialSquad: 3 },
            { name: "Сохоневич Юлия", initialSquad: 3 },
            { name: "Хоружая Екатерина", initialSquad: 4 },
            { name: "Бегеза Екатерина", initialSquad: 4 },
            { name: "Давидович Дмитрий", initialSquad: 4 },
            { name: "Богуш Анастасия", initialSquad: 5 },
            { name: "Косцов Никита", initialSquad: 5 },
            { name: "Рудько Виктор", initialSquad: 5 },
            { name: "Дубина Мария", initialSquad: 6 },
            { name: "Каминский Глеб", initialSquad: 6 },
            { name: "Стеценко Елизавета", initialSquad: 7 },
            { name: "Мазурук Владислава", initialSquad: 7 },
            { name: "Кухарчик Иветта", initialSquad: 7 },
            { name: "Ничик Анна", initialSquad: 8 },
            { name: "Тарасевич Екатерина", initialSquad: 8 },
            { name: "Цикоридзе Анастасия", initialSquad: 8 }
        ];

        let people = [];
        let currentRotation = 0;
        let history = [];

        function getCurrentSquad(person) {
            const initialIndex = ROTATION_ORDER.indexOf(person.initialSquad);
            const currentIndex = (initialIndex + currentRotation) % ROTATION_ORDER.length;
            return ROTATION_ORDER[currentIndex];
        }

        function getNextSquad(squad) {
            const index = ROTATION_ORDER.indexOf(squad);
            return ROTATION_ORDER[(index + 1) % ROTATION_ORDER.length];
        }

        function renderRotationDiagram() {
            const container = document.getElementById('rotationDiagram');
            container.innerHTML = '';
            ROTATION_ORDER.forEach((squad, index) => {
                const num = document.createElement('div');
                num.className = 'chain-number' + (index === currentRotation % ROTATION_ORDER.length ? ' active' : '');
                num.textContent = squad;
                container.appendChild(num);
                if (index < ROTATION_ORDER.length - 1) {
                    const arrow = document.createElement('span');
                    arrow.className = 'chain-arrow';
                    arrow.textContent = '→';
                    container.appendChild(arrow);
                }
            });
        }

        function renderCurrentTable() {
            const tbody = document.getElementById('currentTableBody');
            tbody.innerHTML = '';
            if (people.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-state">нет сотрудников</td></tr>';
                return;
            }
            people.forEach((person) => {
                const currentSquad = getCurrentSquad(person);
                const nextSquad = getNextSquad(currentSquad);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${person.name}</td>
                    <td><span class="squad-num">${currentSquad}</span></td>
                    <td><span class="squad-num next">${nextSquad}</span></td>
                    <td><button class="remove-btn" data-id="${person.id}" title="удалить">☺</button></td>
                `;
                tbody.appendChild(tr);
            });
            tbody.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', () => removePerson(btn.getAttribute('data-id')));
            });
        }

        function renderSquadTable() {
            const tbody = document.getElementById('squadTableBody');
            tbody.innerHTML = '';
            for (let i = 1; i <= TOTAL_SQUADS; i++) {
                const peopleInSquad = people.filter(p => getCurrentSquad(p) === i);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="squad-num">${i}</span></td>
                    <td>${peopleInSquad.length > 0 ? peopleInSquad.map(p => p.name).join('<br>') : '<span style="color: #B8956A; font-style: italic;">пусто</span>'}</td>
                `;
                tbody.appendChild(tr);
            }
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            container.innerHTML = '';
            if (history.length === 0) {
                container.innerHTML = '<div class="empty-state">история пуста</div>';
                return;
            }
            history.slice().reverse().forEach(entry => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="history-date">${entry.date} — ротация #${entry.rotation}</div>
                    <div class="history-assignments">${entry.assignments.map(a => `${a.name} → отряд ${a.squad}`).join('<br>')}</div>
                `;
                container.appendChild(div);
            });
        }

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('syncDot');
            const text = document.getElementById('syncText');
            if (connected) {
                dot.classList.remove('offline');
                text.textContent = 'синхронизировано';
            } else {
                dot.classList.add('offline');
                text.textContent = 'нет подключения';
            }
        }

        function loadData() {
            onValue(ref(db, 'rotation'), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    people = data.people || [];
                    currentRotation = data.currentRotation || 0;
                    history = data.history || [];
                } else {
                    people = INITIAL_PEOPLE.map((p, i) => ({ ...p, id: 'initial_' + i }));
                    currentRotation = 0;
                    history = [];
                    saveData();
                }
                updateConnectionStatus(true);
                renderAll();
            }, (error) => {
                console.error('ошибка:', error);
                updateConnectionStatus(false);
            });
        }

        function saveData() {
            set(ref(db, 'rotation'), {
                people, currentRotation, history,
                lastUpdated: serverTimestamp()
            }).then(() => updateConnectionStatus(true))
              .catch((error) => {
                  console.error('ошибка сохранения:', error);
                  updateConnectionStatus(false);
              });
        }

        function renderAll() {
            document.getElementById('currentTableLoading').style.display = 'none';
            document.getElementById('squadTableLoading').style.display = 'none';
            document.getElementById('currentTable').style.display = 'table';
            document.getElementById('squadTable').style.display = 'table';
            document.getElementById('rotationNumber').textContent = currentRotation + 1;
            renderRotationDiagram();
            renderCurrentTable();
            renderSquadTable();
            renderHistory();
        }

        window.addPersonGlobal = function() {
            const nameInput = document.getElementById('personName');
            const name = nameInput.value.trim();
            if (name) {
                people.push({ name, initialSquad: 1, id: 'person_' + Date.now() });
                nameInput.value = '';
                saveData();
            }
        };

        window.removePerson = function(id) {
            if (confirm('удалить сотрудника?')) {
                people = people.filter(p => p.id !== id);
                saveData();
            }
        };

        window.nextRotationGlobal = function() {
            const assignments = people.map(person => ({ name: person.name, squad: getCurrentSquad(person) }));
            history.push({ date: new Date().toLocaleString('ru-RU'), rotation: currentRotation + 1, assignments });
            currentRotation++;
            saveData();
        };

        window.previousRotationGlobal = function() {
            if (currentRotation > 0) {
                currentRotation--;
                if (history.length > 0) history.pop();
                saveData();
            }
        };

        window.resetRotationGlobal = function() {
            if (confirm('сбросить ротацию?')) {
                currentRotation = 0;
                history = [];
                saveData();
            }
        };

        window.clearHistoryGlobal = function() {
            if (confirm('очистить историю?')) {
                history = [];
                saveData();
            }
        };

        onValue(ref(db, '.info/connected'), (snapshot) => {
            updateConnectionStatus(snapshot.val() === true);
        });

        loadData();
    </script>
</body>
</html>
